plugins {
  id 'fabric-loom' version "1.16+"
  id 'maven-publish'
  id "com.modrinth.minotaur" version "2.+"

}

version = project.mod_version
group = project.maven_group

loom {
  splitEnvironmentSourceSets()

  accessWidenerPath = file("src/main/resources/creator_tools.accesswidener")

  mods {
    "nucleoid-creator-tools" {
      sourceSet sourceSets.client
      sourceSet sourceSets.main
    }
  }
}

repositories {
  maven { url = "https://maven.nucleoid.xyz/" }
  maven { url = "https://maven.gegy.dev/" }
  maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }

}

dependencies {
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
  modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

  modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

  modImplementation "eu.pb4:polymer-core:${project.polymer_version}"
  modImplementation "eu.pb4:polymer-virtual-entity:${project.polymer_version}"
  modImplementation "xyz.nucleoid:server-translations-api:${project.nucleoid_server_translation_api_version}"
  modImplementation "xyz.nucleoid:fantasy:${project.nucleoid_fantasy_version}"
  modImplementation "me.lucko:fabric-permissions-api:${project.lucko_fabric_permissions_api_version}"

  modImplementation "xyz.nucleoid:map-templates:${project.nucleoid_map_templates_version}"
}

processResources {
  inputs.property "version", project.version

  filesMatching("fabric.mod.json") {
    expand "version": project.version
  }
}

tasks.withType(JavaCompile).configureEach {
  it.options.encoding = "UTF-8"
  it.options.release = 21
}

java {
  withSourcesJar()
}

jar {
  from("LICENSE") {
    rename { "${it}_creator_tools"}
  }
}

if (System.getenv("MODRINTH")) {
  modrinth {
    token = System.getenv("MODRINTH")
    projectId = 'HDocER98'// The ID of your modrinth project, slugs will not work.
    versionNumber = "" + version // The version of the mod to upload.
    versionType = "release"
    uploadFile = remapJar // This links to a task that builds your mod jar and sets "uploadFile" to the mod jar.
    gameVersions = [((String) project.minecraft_version)]
    loaders = ["fabric"]
  }

  remapJar {
    finalizedBy project.tasks.modrinth
  }
}